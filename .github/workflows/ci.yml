name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build and run unit tests
        run: swift test --package-path src

      - name: Validate shell scripts
        run: bash -n scripts/build_app.sh tests/e2e.sh tests/live_audio.sh tests/offline_bridge.sh
